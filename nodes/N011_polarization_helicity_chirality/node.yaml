meta:
  id: N011
  title: "Polarization, helicity, chirality baseline (plane waves)"
  status: open
  maturity: M2
  updated_utc: "2026-08-31"
  owner: "WeBeGood"

depends_on:
  - N000

scope:
  classification: "standard_electromagnetism"
  domain: "Classical EM waves; polarization states"
  coordinate_system: "Cartesian + propagation direction k"
  units: "SI (default)"
  boundary: "Polarization geometry alone does not imply a topological particle model"

definitions:
  - symbol: "k"
    meaning: "wavevector"
    units: "1/m"
  - symbol: "omega"
    meaning: "angular frequency"
    units: "rad/s"
  - symbol: "E, B"
    meaning: "EM fields"
    units: "E: V/m, B: T"
  - symbol: "helicity"
    meaning: "projection of spin/angular momentum along propagation direction"
    units: "dimensionless label for polarization state"

claims:
  - id: N011-C1
    statement: "Plane-wave solutions admit two transverse polarization degrees of freedom."
    units: "dimensionless"
  - id: N011-C2
    statement: "For phase exp[i(kz-omega t)], e_sigma=(xhat+i sigma yhat)/sqrt(2) satisfies i khat cross e_sigma=sigma e_sigma; this equation, rather than an ambiguous left/right label, fixes the helicity convention."
    units: "dimensionless"
  - id: N011-C3
    statement: "A change of viewing direction or Fourier-phase convention can swap verbal handedness labels but cannot change predictions after the convention is translated consistently."
    units: "dimensionless convention statement"
  - id: N011-C4
    statement: "Classical polarization and helicity do not by themselves establish a localized particle, knot, or Atom 2.1 ontology."
    units: "not applicable"

assumptions:
  - "Vacuum plane-wave baseline (inherits N000)."
  - "Positive frequency omega and phasor exp[i(kz-omega t)]."
  - "Helicity sign is the eigenvalue of i khat cross acting on the complex transverse basis."

interfaces:
  exports:
    - "Polarization basis: linear and circular"
    - "Convention-invariant helicity eigenvalue definition for plane waves"
    - "Explicit time-rotation and viewing-direction statement"
  imports:
    - "N000: plane-wave orthogonality constraints"

