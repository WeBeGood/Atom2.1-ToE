claims:
- id: N019-C1
  statement: Under constant-lambda and compatible boundary conditions, U_B=lambda H_B/(2mu0); total Maxwell energy
    includes electric energy.
  units: J; H_B T^2 m^4
  proof: math/proofs.md#EH-01
- id: N019-C2
  statement: Grok imaginary-part helicity formula vanishes on real-lambda curl eigenfields and is not magnetic helicity.
  units: formula disproved as stated
  proof: math/proofs.md#EH-01
- id: N019-C3
  statement: Flux/helicity-preserving dilation in unbounded space gives U_B[B_a]=a U_B[B], so the cited constraint
    alone does not select a finite equilibrium radius.
  units: a dimensionless; energy J
  proof: math/proofs.md#EH-02
- id: N019-C4
  statement: Thin-tube energy reduction requires transverse integration and geometric Jacobian; line energy density
    need not equal mechanical tension.
  units: J/m
  proof: math/proofs.md#EH-03
- id: N019-C5
  statement: For an assumed elastic model at fixed total twist, uniform twist minimizes energy and L*=abs(Theta)sqrt(C/(2tau));
    this does not derive C or tau from Maxwell.
  units: L m; C J m; tau J/m
  proof: math/proofs.md#EH-03
- id: N019-C6
  statement: Hermitian C3 circulants share Fourier eigenvectors but have coupling-dependent eigenvalues; real coupling
    yields a double degeneracy.
  units: operator units specified by chosen physical model
  proof: math/proofs.md#EH-04
- id: N019-C7
  statement: Invariant mass requires total momentum and the relativistic oscillation phase is Delta m^2 c^3 D/(2E
    hbar) for SI masses.
  units: mass kg; phase dimensionless
  proof: math/proofs.md#EH-05
