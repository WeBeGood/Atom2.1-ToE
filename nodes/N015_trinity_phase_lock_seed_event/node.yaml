validation:
  checks:
    - "Run the standard-library N015 simulation and require all geometry, field, observable, and phase-scan checks to pass."
    - "Verify alpha=120 degrees and delta are represented as independent parameters."
    - "Verify the analytic values at Gamma=0, 2pi/3, and pi against deterministic numerical evaluation."
    - "Verify spatial averaging over one fringe removes interference cross terms."
    - "Require the readable paper and node text to state that Maxwell superposition creates no new independent photon or neutrino."
  falsifiers:
    - "Any failure of the stated geometry or observables under the declared assumptions invalidates this vector baseline."
    - "Linear Maxwell theory already falsifies a claim that Gamma=120 degrees is an energy or flux extremum for this input family."
    - "The neutrino-seed interpretation remains unsupported unless additional dynamics yield localization, stability, conserved properties, and a prediction distinguishable from ordinary interference."
