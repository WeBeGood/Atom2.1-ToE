meta:
  id: N015
  title: "Two coherent vacuum plane waves at 120 degrees (vector baseline)"
  status: open
  maturity: M3
  updated_utc: "2026-09-01"
  owner: "WeBeGood"

depends_on:
  - N000
  - N011

scope:
  classification: "mixed_standard_result_and_project_hypothesis"
  domain: "Classical coherent superposition of two vacuum plane-wave modes"
  coordinate_system: "Right-handed Cartesian frame; wavevectors in the x-y plane"
  units: "SI"
  standard_result: "Linear Maxwell theory predicts a two-wave interference field with no new independent mode."
  project_hypothesis: "Atom 2.1 may label a selected interference region a neutrino seed; this interpretation is not derived here."
  excludes:
    - "CMB or other background photon-field models"
    - "Quantum electrodynamics or photon creation/annihilation calculations"
    - "Charge-only or magnetic-only propagating vacuum waves"
    - "Nonlinear, material, boundary-induced, or self-confining dynamics"

definitions:
  - symbol: "alpha"
    meaning: "geometric crossing angle between k1 and k2; fixed here to 2pi/3"
    units: "rad"
  - symbol: "delta"
    meaning: "controllable phase offset of wave 2 relative to wave 1"
    units: "rad"
  - symbol: "Gamma"
    meaning: "local relative phase delta+(k2-k1) dot r"
    units: "rad"
  - symbol: "k1,k2"
    meaning: "equal-magnitude vacuum wavevectors with |k1|=|k2|=k"
    units: "m^-1"
  - symbol: "E0"
    meaning: "peak electric-field amplitude of each input wave"
    units: "V m^-1"
  - symbol: "E1,E2"
    meaning: "input electric fields with common z-directed linear polarization"
    units: "V m^-1"
  - symbol: "B1,B2"
    meaning: "input magnetic fields Bi=(ki_hat cross Ei)/c"
    units: "T"
  - symbol: "I0"
    meaning: "cycle-averaged intensity of either wave, eps0*c*E0^2/2"
    units: "W m^-2"

claims:
  - id: N015-C1
    statement: "For equal magnitudes k and crossing angle alpha=120 degrees, k1+k2=k xhat and k1-k2=sqrt(3)k yhat; these vector identities do not replace the two modes by a single plane wave."
    units: "k1,k2: m^-1"
  - id: N015-C2
    statement: "For common z polarization, linear Maxwell superposition gives E=E1+E2 and B=B1+B2 with local relative phase Gamma=delta+(k2-k1) dot r."
    units: "E: V m^-1; B: T; Gamma: rad"
  - id: N015-C3
    statement: "At alpha=120 degrees, cycle-averaged observables are <u>=eps0 E0^2[1+cos(Gamma)/4] and <S>=I0 xhat[1+cos(Gamma)], with <g>=<S>/c^2."
    units: "u: J m^-3; S: W m^-2; g: kg m^-2 s^-1"
  - id: N015-C4
    statement: "At a point where Gamma=120 degrees, <u>=(7/8)eps0 E0^2 and <S>=(1/2)I0 xhat; Gamma=120 degrees is not an extremum of either observable in linear Maxwell theory."
    units: "u: J m^-3; S: W m^-2"
  - id: N015-C5
    statement: "Averaging over one transverse fringe removes cos(Gamma), recovering the sum of the two input energy densities and the vector sum of their individual Poynting fluxes."
    units: "u: J m^-3; S: W m^-2"
  - id: N015-C6
    statement: "Calling any part of this interference field a neutrino seed is an Atom 2.1 hypothesis, not a consequence of linear vacuum Maxwell equations and not evidence for a new photon or neutrino."
    units: "not applicable"

assumptions:
  - "Both inputs are monochromatic, mutually coherent vacuum plane waves with the same omega, k=omega/c, and peak amplitude E0."
  - "The wavevectors lie in the x-y plane, are symmetric about +x, and have alpha=120 degrees."
  - "Both electric fields use the common transverse polarization zhat; other polarization choices change interference terms."
  - "Fields are ideal infinite plane waves; all energy and momentum statements are local cycle averages or fringe averages."
  - "The crossing angle alpha and phase offset delta are independent parameters."
  - "No nonlinear interaction, material response, boundary, source, quantization, or localization mechanism is assumed."

interfaces:
  exports:
    - "Explicit 120-degree wavevector geometry and fringe spacing lambda/sqrt(3)"
    - "Phase-dependent vector fields for a common transverse polarization"
    - "Cycle-averaged energy density, Poynting vector, momentum density, and field invariants"
    - "Standard-result versus neutrino-seed-hypothesis boundary"
  imports:
    - "N000: linear vacuum Maxwell equations, plane waves, energy, and momentum"
    - "N011: polarization and phasor conventions"

