meta:
  id: N000
  title: "Classical electromagnetism in vacuum (Maxwell baseline)"
  status: open
  maturity: M3
  updated_utc: "2026-08-31"
  owner: "WeBeGood"

depends_on: []

scope:
  classification: "standard_electromagnetism"
  domain: "Classical, local electromagnetism in a source-free vacuum region"
  spacetime: "Flat Minkowski spacetime; inertial Cartesian coordinates (x,y,z,t)"
  units: "SI"
  excludes:
    - "Quantum electrodynamics and photon-counting effects"
    - "Material media, dispersion, absorption, and nonlinear constitutive laws"
    - "Curved-spacetime electrodynamics"
    - "Atom 2.1 particle, knot, CMB-medium, or phase-lock hypotheses"

definitions:
  - symbol: "E"
    meaning: "electric field vector"
    units: "V m^-1"
  - symbol: "B"
    meaning: "magnetic flux-density vector"
    units: "T"
  - symbol: "rho"
    meaning: "free electric charge density"
    units: "C m^-3"
  - symbol: "J"
    meaning: "free electric current density"
    units: "A m^-2"
  - symbol: "mu0"
    meaning: "vacuum magnetic permeability; measured after the 2019 SI revision"
    units: "H m^-1 = N A^-2"
  - symbol: "eps0"
    meaning: "vacuum electric permittivity, eps0 = 1/(mu0 c^2)"
    units: "F m^-1"
  - symbol: "c"
    meaning: "SI defining constant for the speed of light in vacuum"
    units: "m s^-1"
  - symbol: "u"
    meaning: "electromagnetic energy density"
    units: "J m^-3"
  - symbol: "S"
    meaning: "Poynting energy-flux vector"
    units: "W m^-2"
  - symbol: "g"
    meaning: "electromagnetic momentum density in vacuum"
    units: "kg m^-2 s^-1"

claims:
  - id: N000-C1
    statement: "In a source-free vacuum region, Maxwell's SI equations imply homogeneous wave equations for sufficiently smooth E and B with characteristic speed c = 1/sqrt(mu0 eps0)."
    units: "E: V m^-1; B: T; c: m s^-1"
  - id: N000-C2
    statement: "A nonzero monochromatic vacuum plane wave satisfies omega = c|k|, k dot E0 = k dot B0 = 0, and B0 = (k cross E0)/omega."
    units: "omega: rad s^-1; k: m^-1; E0: V m^-1; B0: T"
  - id: N000-C3
    statement: "Maxwell's equations imply Poynting's theorem: partial_t u + div S = -J dot E, with u=(eps0|E|^2+|B|^2/mu0)/2 and S=(E cross B)/mu0."
    units: "u: J m^-3; S: W m^-2; J dot E: W m^-3"
  - id: N000-C4
    statement: "In vacuum the field momentum density is g=S/c^2=eps0(E cross B), and momentum transfer is described by the Maxwell stress tensor."
    units: "g: kg m^-2 s^-1; stress: Pa"
  - id: N000-C5
    statement: "These results are standard classical electromagnetism; they impose a recovery limit on Atom 2.1 but do not establish any Atom 2.1-specific ontology or particle model."
    units: "not applicable"

assumptions:
  - "E and B are at least twice continuously differentiable on the region used for the wave-equation derivation."
  - "The derivation is local to an inertial Cartesian chart in flat spacetime."
  - "Vacuum is linear, homogeneous, isotropic, and source-free: rho=0 and J=0 in the region."
  - "Spatial derivatives commute with time derivatives, and standard right-handed vector-calculus conventions apply."
  - "Boundary and initial data satisfy the divergence constraints at the initial time."
  - "c=299792458 m s^-1 exactly in SI; mu0 and eps0 follow the current CODATA convention and mu0*eps0=1/c^2."

interfaces:
  exports:
    - "Source and source-free Maxwell equations in SI vector form"
    - "Vacuum wave equations with stated differentiability and domain assumptions"
    - "Plane-wave dispersion, transversality, and amplitude relations"
    - "Poynting energy balance, vacuum momentum density, and Maxwell stress tensor"
    - "Validity boundary separating standard electromagnetism from Atom 2.1 hypotheses"
  imports: []

