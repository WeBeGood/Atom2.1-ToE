validation:
  checks:
    - "Symbolically derive both vacuum wave equations using curl-curl identities and the divergence constraints."
    - "Numerically verify c, vacuum impedance, plane-wave transversality, dispersion, B0=(k cross E0)/omega, and equal electric/magnetic plane-wave energy contributions."
    - "Run tests/test_maxwell_baseline.py and require every deterministic check to pass."
    - "Parse every node YAML and regenerate committed claims/index/paper-outline artifacts without a diff on a second run."
  falsifiers:
    - "An internally inconsistent derivation or failed dimensional identity invalidates this baseline package."
    - "A reproducible experiment within the stated classical-vacuum domain that contradicts Maxwell predictions after controlled uncertainties would falsify or restrict the baseline; it would not by itself validate Atom 2.1."

