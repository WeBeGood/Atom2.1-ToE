claims:
- id: N020-C1
  statement: Three losses of one eighth of remaining energy compound to 169/512, not 3/8.
  units: dimensionless
  proof: math/proofs.md#TL-01
- id: N020-C2
  statement: An assumed differential log-frequency law integrates to exponential redshift; matching a_loss=H0/c
    is calibration.
  units: a_loss 1/m; redshift dimensionless
  proof: math/proofs.md#TL-01
- id: N020-C3
  statement: Poisson fixed-fraction events give mean E/E0=exp(-mu kappa) and CV=sqrt(exp(mu kappa^2)-1).
  units: dimensionless
  proof: math/proofs.md#TL-02
- id: N020-C4
  statement: At half surviving mean and kappa=1/8, exact relative RMS width is 0.30084503098; the ideal distribution
    is discrete.
  units: dimensionless
  proof: math/proofs.md#TL-02
- id: N020-C5
  statement: Mean-log-energy and log-mean-energy attenuation coefficients differ; at kappa=1/8 their ratio is 1.06825114.
  units: dimensionless ratio
  proof: math/proofs.md#TL-02
- id: N020-C6
  statement: H0=70 km/s/Mpc, n=4.1e8/m^3 and kappa=1/8 imply a back-calibrated sigma=1.4764982e-34 m^2; wavelength
    squared is not a required interaction area.
  units: m^2
  proof: math/proofs.md#TL-03
- id: N020-C7
  statement: A constant propagation delay leaves emission intervals unchanged; spectral, angular, timing and reservoir
    predictions need an explicit interaction kernel.
  units: timing derivative dimensionless
  proof: math/proofs.md#TL-04
