scope:
  domain: All-direction CMB spectral input; standing-wave, C3 and Beltrami representations of Maxwell fields
  coordinate_system: Cartesian baseline; compatible with forms/potentials; axis defined by k_hat
  units: SI (default)
  classification: proved_representations_and_conditional_examples_with_open_particle_identity
definitions:
- symbol: T_cmb
  meaning: CMB blackbody temperature (parameter)
  units: K
- symbol: u_nu
  meaning: spectral energy density of CMB (per frequency)
  units: J/m^3/Hz
- symbol: A
  meaning: vector potential (candidate Beltrami family)
  units: V·s/m
- symbol: kappa
  meaning: Beltrami proportionality constant in ∇×A = kappa A
  units: 1/m
- symbol: k_hat
  meaning: local line axis / propagation direction unit vector
  units: dimensionless
- symbol: seed
  meaning: seed descriptor exported by N015
  units: dimensionless + parameter set
- symbol: line
  meaning: extended seed-line object (topological/field descriptor)
  units: dimensionless + length scale(s)
claims:
- id: N016-C1
  statement: Given a seed criterion S(E,B) from N015, repeated/propagated satisfaction of the criterion along an
    axis defines a candidate extended object ('seed-line') with direction k_hat.
  units: k_hat dimensionless; line has length scale(s) in m
- id: N016-C2
  statement: The observed CMB spectrum supplies a broadband spectral input. In linear source-free Maxwell theory
    background superposition is not a dynamical forcing or mode-coupling term; a physical driver requires a separate
    constitutive model.
  units: 'u_nu: J/m^3/Hz; T_cmb: K'
- id: N016-C3
  statement: Constant curl-eigenvalue fields form a candidate monochromatic helical family; kappa sets inverse spatial
    scale but does not alone supply confinement or stability.
  units: 'kappa: 1/m; A: V·s/m'
- id: N016-C4
  statement: Helicity/handedness conventions from N011 must be consistent with the Beltrami ansatz and with the
    seed functional’s sensitivity to chirality.
  units: dimensionless helicity label
- id: N016-C5
  statement: CMB may become load-bearing in later nodes when used to constrain constants and rest-mass scales; in
    N016 it is introduced as a formally defined spectral driver/constraint.
  units: scoping statement
- id: N016-C6
  statement: Standing-wave bases are unitary representations of opposite-direction Maxwell modes; they do not imply
    fixed thermal modal phases.
  units: dimensionless basis map
  classification: conditional_mathematical_result
  proof: math/cmb_trinity_proofs.md#CMB-02
- id: N016-C7
  statement: On a rotation-invariant domain, C3 projectors commute with Maxwell evolution, are orthogonal, and sum
    to the identity; they decompose the full field without new degrees of freedom.
  units: projectors dimensionless; energy J
  classification: conditional_mathematical_result
  proof: math/cmb_trinity_proofs.md#CMB-03
- id: N016-C8
  statement: For real divergence-free e with curl e=k e, E=e cos(ckt), B=-e sin(ckt)/c is an exact standing Beltrami-Maxwell
    solution with electric/magnetic exchange and zero Poynting flux.
  units: E V/m; B T; k 1/m
  classification: conditional_mathematical_result
  proof: math/cmb_trinity_proofs.md#CMB-04
- id: N016-C9
  statement: An equal-occupation thermal triplet has covariance P I, invariant under a unitary C3/DFT transformation;
    isotropy is not phase locking.
  units: modal covariance normalization dependent
  classification: conditional_mathematical_result
  proof: math/cmb_trinity_proofs.md#CMB-01 to CMB-03
- id: N016-C10
  statement: Equal curl eigenvalues remain equal under arbitrary constant relative phase; free modal dynamics do
    not select an attracting 120-degree lock.
  units: phase rad; curl eigenvalue 1/m
  classification: conditional_mathematical_result
  proof: math/cmb_trinity_proofs.md#CMB-05
- id: N016-C11
  statement: No nonzero square-integrable constant-real-nonzero-lambda curl eigenfield exists on unbounded R^3;
    periodic or broadband solutions are distinct cases.
  units: field norm finite; lambda 1/m
  classification: conditional_mathematical_result
  proof: math/cmb_trinity_proofs.md#CMB-06
- id: N016-C12
  statement: Numerical Planck integrals at T=2.725 K give u=4.17173825e-14 J/m^3 and n_gamma=4.10500843e8 m^-3;
    the measured temperature is input, not a predicted constant.
  units: J/m^3; m^-3
  classification: conditional_mathematical_result
  proof: math/cmb_trinity_proofs.md#CMB-01
assumptions:
- The CMB monopole is idealized as statistically homogeneous, isotropic unpolarized blackbody radiation; departures
  require specified correlations.
- The owner proposes a coherent standing BBRV/NewWave interpretation; that proposal is preserved separately from
  the observed spectrum.
- The explicit C3 projector is a candidate mathematical representation, not an assertion that the owner uniquely
  chose this map.
- N015 supplies a two-wave baseline and leaves physical seed dynamics open.
- Periodic/generalized monochromatic examples are not finite-energy localized particles.
interfaces:
  exports:
  - Definition of seed-line as propagated seed criterion along k_hat
  - 'CMB spectral forcing interface: u_nu(ν; T_cmb) as driver/constraint'
  - 'Beltrami candidate mode family: ∇×A = kappa A'
  - Aether/Kelvin interpretation notes (non-load-bearing narrative)
