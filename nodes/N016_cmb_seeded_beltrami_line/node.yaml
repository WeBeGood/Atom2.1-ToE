validation:
  checks:
  - Run code/sim.py and tests/test_cmb_peer_review.py.
  - Numerical curl/time derivatives satisfy Maxwell; Planck quadratures agree with analytic integrals.
  - C3 projection algebra and energy preservation are checked independently.
  falsifiers:
  - A nonzero residual beyond numerical tolerance invalidates the stated standing solution implementation.
  - A proposed physical conversion must differ observably from the representation and include energy-momentum accounting.
  - No attracting phase lock follows from the stated free evolution; additional dynamics must be explicit.
