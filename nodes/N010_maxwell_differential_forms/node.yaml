    type: book
    note: "Baseline electromagnetic conventions and covariant formulation."

validation:
  checks:
    - "Map dF=0 to d3 B=0 and partial_t B+d3 E=0."
    - "Map dHcal=Jcal to d3 D=rho vol3 and d3 H=j+partial_t D."
    - "Apply D=eps0 E and H=B/mu0 to recover N000 in SI."
  falsifiers:
    - "If the 3+1 split does not reproduce the standard vector Maxwell equations under stated conventions."
