meta:
  name: Atom2.1 SuperSeed
  schema: atom2.1.superseed
  version: 0.1.1
  created_utc: '2026-02-19'
  updated_utc: '2026-09-14'
  owner: WeBeGood
  purpose:
  - Single YAML that declares the full Atom 2.1 initialization contract
  - Source-of-truth that can regenerate the split-pack files
  - Initialize LLM, human, or simulation consistently
  - Make the Mach-1 Luminal Realm versus Mach>1 Superluminal Realm separation explicit
outputs:
  files:
  - path: manifest.yaml
    generate_from: manifest
  - path: Atom2.1_seed_latest.yaml
    generate_from: seed_latest
  - path: derived_ledger.yaml
    generate_from: derived_ledger
  - path: active_state_pointer.yaml
    generate_from: active_state_pointer
  - path: frontier.yaml
    generate_from: frontier
  - path: INIT.md
    generate_from: init_md
  - path: LLM_BOOTSTRAP_PROMPT.txt
    generate_from: llm_prompt
contract:
  rules:
    continuity_rule: Continue from active_state_pointer; do not restart from scratch.
    no_rederive_rule: Do not re-derive items listed in derived_ledger:settled unless explicitly requested.
    scope_rule: Stay inside Atom 2.1 vocabulary unless user asks for cross-walk to standard physics.
    rigor_rule: Use units, dimensions, and explicit assumptions; flag speculation.
    attribution_rule: Treat WeBeGood as co-creator; preserve IP sensitivity.
    regime_rule: Default Atom 2.1 discussions to the Mach-1 Luminal Realm with c=1 unless the user explicitly enters
      the Mach>1 Superluminal Realm.
manifest:
  meta:
    name: Atom2.1 Manifest
    schema: atom2.1.manifest
    version: 0.1.0
  files:
  - path: First Yaml.yaml
    role: smoke_test_seed
  - path: Atom2.1_seed_latest.yaml
    role: seed_latest
  - path: derived_ledger.yaml
    role: derived_ledger
  - path: active_state_pointer.yaml
    role: active_state_pointer
  - path: frontier.yaml
    role: open_frontier
  - path: INIT.md
    role: human_llm_instructions
  - path: LLM_BOOTSTRAP_PROMPT.txt
    role: single_shot_prompt
  load_order:
  - manifest.yaml
  - Atom2.1_seed_latest.yaml
  - derived_ledger.yaml
  - active_state_pointer.yaml
  - frontier.yaml
seed_latest:
  meta:
    name: Atom2.1 Seed (Latest)
    schema: atom2.1.seed
    version: 0.1.1
  axioms:
  - id: LUMINAL
    name: Mach-1 Luminal Realm
    statement: 'Most Atom 2.1 development is in the Luminal Realm: c=1, Mach 1, waves following waves through the
      Beltrami Blackbody Radiation Vortex photon/CMB sea.'
  - id: EMASS
    name: Natural-Unit Mass-Energy Equivalence
    statement: In the Mach-1 Luminal Realm, Einstein's E=mc^2 is handled in natural units as E=m; Restless Neutrino
      Mass and Rest Neutrino Mass are the same mass-energy in different topological states.
  - id: A120
    name: Luminal Trinity 120° Threshold
    statement: Within the Mach-1 Luminal Realm, the 120° Trinity Addition is treated as the first stable NewWave
      phase-lock threshold, not as the full future superluminal angle domain.
  - id: CMBMED
    name: CMB as Stabilizing Medium
    statement: CMB acts as universal medium supporting resonance / stabilization of wave knots in the Beltrami Blackbody
      Radiation Vortex.
  - id: REGIME_SPLIT
    name: Luminal versus Superluminal Regimes
    statement: Atom 2.1 separates the developed Mach-1 Luminal Realm from the proposed Mach>1 Superluminal Realm,
      where incidence angles run from 120° toward 180° and Mach-infinity is a geometric/interference limit.
  primitives:
  - photon_wave
  - antiwave
  - trinity_addition
  - phase_lock_120_luminal_threshold
  - luminal_realm_mach_1
  - superluminal_realm_mach_gt_1
  - mach_infinity_180_limit
  - knot_loop
  - seed_line
  - neutrino_kink
  - beltrami_vortex_mode
  canonical_notes:
  - Particles modeled as self-sustaining geometric wave patterns; rest mass from circular energy circulation.
  - Neutrino phenomena interpreted as boundary/turning-region behavior at loop edges.
  - Electron model under development; suspected geometric scaling relates to fine-structure constant.
  - 'Default ledger interpretation: unless a section explicitly says Superluminal Realm, treat the math as c=1,
    Mach-1 Luminal Realm math.'
  - 'Superluminal Realm development is proposed/open: it concerns interference geometry, phase closure, superluminal-looking
    channel artifacts, and Mach-infinity limits, not ordinary energy traveling faster than c.'
  - 'Owner clarification 2026-09-14: Trinity acts on the complete all-direction CMB/BBRV field; the two-isolated-beam
    baseline is not the complete proposal.'
  - Standing-wave, C3 and Beltrami representations are proved conditionally in N016. The proposed physical identification
    as a neutrino field remains distinct from the observed blackbody spectrum.
  - Accepted model conventions in the settled ledger are not automatically established experimental facts; use epistemic_status
    and explicit proof assumptions.
  - Mach 1 for constituent waves does not require the net flux of a standing field to travel at c. E=mc^2 denotes
    rest energy only in the rest frame; use total four-momentum for invariant mass.
derived_ledger:
  meta:
    name: Atom2.1 Derived Ledger
    schema: atom2.1.ledger
    version: 0.1.1
  settled:
  - id: LUMINAL
    title: Mach-1 Luminal Realm convention
    status: accepted
    statement: Atom 2.1's developed core defaults to c=1, Mach 1, waves following waves in the BBRV photon/CMB sea.
    assumptions:
    - Natural units are used inside the Luminal Realm.
    - SI factors of c must be restored before comparing to external measurements.
    open_limits:
    - Does not itself prove particle closure, gravity, or tired-light mechanisms.
    notes:
    - This resolves the prior Mach-1 dimensional-mixing confusion by declaring the working unit convention.
    epistemic_status: accepted_project_convention_not_independent_physical_proof
  - id: EMASS
    title: Restless/Rest Neutrino Mass equivalence in c=1 units
    status: accepted
    statement: 'With c=1, E=mc^2 reduces to E=m; Restless Neutrino Mass and Rest Neutrino Mass are treated as the
      same mass-energy in different topological states: open wave motion versus stored curl/kink/loop/knot structure.'
    assumptions:
    - This is an Atom 2.1 natural-unit statement, not a claim that ordinary photons have rest mass in standard relativity.
    open_limits:
    - Requires careful SI restoration in cosmology, G, and Lambda derivations.
    - Calculate invariant mass from U^2-c^2|P|^2. Constituent luminality and natural units do not identify arbitrary
      frame energy with rest mass.
    notes:
    - Use this as the default mass-energy language for BBRV/Luminal Realm work.
    epistemic_status: accepted_project_convention_not_independent_physical_proof
  - id: A120
    title: Luminal Trinity 120° threshold
    status: accepted
    statement: The 120° Trinity Addition is retained as the Mach-1 Luminal Realm threshold for two Mach-1 wave structures
      defining a third Mach-1 NewWave mode.
    assumptions:
    - Trinity Addition is an Atom 2.1 NewWave rule and must be distinguished from ordinary four-momentum addition.
    - The intended construction is within the all-direction CMB field, not limited to the N015 two-beam scope.
    open_limits:
    - The 120° case is not the entire Superluminal Realm and is not by itself a tired-light derivation.
    - N016 proves a cyclic representation but free Maxwell evolution does not select an attracting 120-degree phase
      lock.
    notes:
    - Older wording that made 120° the only interaction angle should be read as Luminal-Realm shorthand.
    epistemic_status: accepted_project_convention_not_independent_physical_proof
  - id: CMBMED
    title: CMB/BBRV stabilizing medium
    status: accepted
    statement: The CMB is treated as the observable photon-sea/BBRV medium supporting resonance, seed-line behavior,
      and wave-knot stabilization.
    assumptions:
    - CMB medium language belongs to Atom 2.1 model-building unless cross-walked to standard cosmology.
    open_limits:
    - Does not fix the absolute vacuum-energy scale by itself.
    - Observed isotropy/blackbody spectrum is not proof of coherent standing phases, neutrino identity or self-confinement.
    notes:
    - Use BBRV photon/CMB sea as the default Luminal Realm background.
    epistemic_status: accepted_project_convention_not_independent_physical_proof
  - id: REGIME_SPLIT
    title: Luminal and Superluminal regime separation
    status: accepted
    statement: Atom 2.1 is now explicitly divided into the developed Mach-1 Luminal Realm and the proposed Mach>1
      Superluminal Realm. Most prior ledger work belongs to the Luminal Realm.
    assumptions:
    - Mach>1 language describes geometric/interference/phase-channel artifacts unless explicitly proven otherwise.
    open_limits:
    - Superluminal Realm mathematics remains frontier work.
    notes:
    - This entry is the main ledger correction requested on 2026-09-07.
    epistemic_status: accepted_project_convention_not_independent_physical_proof
  - id: CMB-STANDING-BASIS
    title: Standing representation of the full radiation field
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: Opposite-direction Maxwell modes admit a unitary standing sine/cosine basis preserving the complete
      field and energy.
    assumptions:
    - All partners and transformed coefficients retained.
    proof: nodes/N016_cmb_seeded_beltrami_line/math/cmb_trinity_proofs.md
    proof_section: CMB-02
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: CMB-C3-DECOMPOSITION
    title: Threefold decomposition of an all-direction Maxwell field
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: Pi_j=(1/3) sum_r omega^(-jr) R^r are orthogonal complete projectors commuting with Maxwell evolution.
    assumptions:
    - Rotation-invariant domain and compatible boundary conditions.
    - Use finite energy or controlled spectral/volume normalization.
    proof: nodes/N016_cmb_seeded_beltrami_line/math/cmb_trinity_proofs.md
    proof_section: CMB-03
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: CMB-THERMAL-COVARIANCE
    title: Thermal covariance invariance under passive Trinity transform
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: A same-frequency equal-occupation covariance P I is unchanged by a unitary three-mode transformation.
    assumptions:
    - Ideal homogeneous isotropic unpolarized free thermal ensemble.
    - No independently specified nonthermal coherence or physical nonlinear transformation.
    proof: nodes/N016_cmb_seeded_beltrami_line/math/cmb_trinity_proofs.md
    proof_section: CMB-01 to CMB-03
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: CMB-STANDING-BELTRAMI
    title: Exact standing Beltrami-Maxwell example
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: For real divergence-free e with curl e=k e, E=e cos(ckt), B=-e sin(ckt)/c obey vacuum Maxwell and
      exchange electric/magnetic energy with zero Poynting flux.
    assumptions:
    - Constant k>0; fields are periodic/generalized modes unless localization is separately specified.
    proof: nodes/N016_cmb_seeded_beltrami_line/math/cmb_trinity_proofs.md
    proof_section: CMB-04
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: CMB-PHASE-NONSELECTION
    title: Curl and free evolution do not uniquely select 120-degree phase
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: Any constant-phase superposition of equal curl-eigenvalue fields retains that eigenvalue; free equal-frequency
      phases are neutrally preserved.
    assumptions:
    - Linear source-free Maxwell evolution.
    - No claim excluding separately specified coupled dynamics.
    proof: nodes/N016_cmb_seeded_beltrami_line/math/cmb_trinity_proofs.md
    proof_section: CMB-05
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: CMB-LOCALIZATION-LIMIT
    title: No nonzero global L2 constant-lambda curl eigenfield
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: The Helmholtz/Fourier shell argument excludes a nonzero square-integrable constant-real-nonzero-lambda
      curl eigenfield on R^3.
    assumptions:
    - Unbounded flat space, square integrability, constant real nonzero eigenvalue.
    - Does not exclude broadband time-dependent finite-energy knots or bounded modes.
    proof: nodes/N016_cmb_seeded_beltrami_line/math/cmb_trinity_proofs.md
    proof_section: CMB-06
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: EH-MAGNETIC-RELATION
    title: Correctly normalized magnetic energy-helicity relation
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: U_B=lambda H_B/(2mu0), distinct from total Maxwell energy; Grok imaginary-part identity fails on
      an explicit nonzero-helicity example.
    assumptions:
    - Constant nonzero lambda and compatible gauge/boundary conditions.
    proof: nodes/N019_energy_helicity_modes/math/proofs.md
    proof_section: EH-01
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: EH-ELASTIC-MINIMUM
    title: Conditional uniform-twist elastic energy minimum
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: For fixed total twist, U=tau L+C Theta^2/(2L); positive fixed tau,C give L*=abs(Theta)sqrt(C/(2tau)).
    assumptions:
    - Postulated elastic functional; no derivation of its coefficients from Maxwell.
    - Fixed total twist, not fixed twist density; effective model valid at minimum.
    proof: nodes/N019_energy_helicity_modes/math/proofs.md
    proof_section: EH-03
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: EH-C3-SPECTRAL-FREEDOM
    title: C3 does not fix a mass spectrum
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: A Hermitian circulant has Fourier eigenvectors but eigenvalues a+2Re(b omega^j); unspecified coefficients
      prevent a mass prediction.
    assumptions:
    - Circulant Hermitian three-mode operator.
    proof: nodes/N019_energy_helicity_modes/math/proofs.md
    proof_section: EH-04
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: TL-POISSON-MOMENTS
    title: Exact independent-event loss statistics
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: Poisson fixed-fraction losses give CV=sqrt(exp(mu kappa^2)-1), equal to 0.30084503098 at half mean
      energy and kappa=1/8.
    assumptions:
    - Independent Poisson event counts, fixed loss fraction, no energy-dependent rate.
    - Not a universal constraint on coherent/deterministic alternatives.
    proof: nodes/N020_tired_light_statistics/math/proofs.md
    proof_section: TL-02
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  not_settled:
  - id: TL-TENSION-TWIST
    title: Longitudinal tension transfer into loop twist
    status: open
    category: conjecture
    statement: Traveling NewWave Charge-Only longitudinal tension may transfer energy into cold void loops or Neutrino
      Ether structures, lowering frequency while preserving propagation direction; receiving structures gain stored
      twist/restless mass.
    attribution: Craig Fink (WeBeGood), with Grok-assisted exploration; user terminology clarified in the supplied
      discussion.
    open_limits:
    - Specify the interaction and receiving degrees of freedom, including energy and forward momentum transfer.
    - Derive frequency conversion rather than amplitude attenuation; derive per-event angular and spectral preservation.
    - Loop phase locking and stability remain to be supplied or linked to existing derivations.
    provenance: notes/grok_tired_light_ledger_additions.md
  - id: TL-VOID-FILAMENT
    title: Environment-dependent redshift and propagation delay
    status: open
    category: conjecture
    statement: At comparable path lengths, cold void paths may produce greater longitudinal Charge-Only frequency
      loss but less delay than cosmic-web filament paths; filament matter/knots/twist may increase delay and Magnetic-Only
      lensing.
    attribution: Craig Fink (WeBeGood); September 5 void/filament conjecture and terminology correction.
    open_limits:
    - Derive dependence on local ether state and separate propagation-speed change from additional bent-path length.
    - The glass analogy supplies no constitutive law. Cosmic-web filament is intended, not a separate topological
      cosmic string.
    - Redshift is longitudinal in this conjecture; the unconfirmed transverse-redshift wording is superseded.
    provenance: notes/grok_tired_light_ledger_additions.md
  - id: DARK-TENSION-TWIST
    title: Dark energy as longitudinal tension; dark matter as magnetic twist
    status: open
    category: conjecture
    statement: Within Atom 2.1, dark energy is proposed to correspond to alternating charge attraction and longitudinal
      tension/compression along seed-lines, while dark matter corresponds to magnetic circulation, loops and stored
      twist.
    attribution: Craig Fink (WeBeGood), user-stated physical identification.
    equations:
    - p_vec = p n_hat; d(p_vec) = n_hat dp + p d(n_hat).
    open_limits:
    - The momentum decomposition is an identity; assigning magnitude change to tension and direction change to magnetic
      coupling is the conjecture.
    - Twist stores energy too; a tension-to-twist transfer does not automatically establish confined rest mass.
    - Derive the proposed interactions and compare their predictions with the phenomena attributed to dark energy
      and dark matter.
    provenance: notes/grok_tired_light_ledger_additions.md
  - id: TL-LOSS-LAW
    title: Conditional redshift accumulation and reservoir balance
    status: open
    category: derived_proposed
    statement: If d ln(nu)/ds = -a_loss(s), then 1+z = exp(integral a_loss(s) ds); the loss law is assumed, not
      derived from the interference calculation.
    attribution: Grok-assisted discussion; conditional integration retained with the audit limitations.
    units: 'a_loss: m^-1; s: m; nu: Hz; z: dimensionless. a_loss is not the fine-structure constant.'
    assumptions:
    - For independent targets of number density n_target and cross-section sigma, dP=n_target sigma ds; a_loss=kappa
      n_target sigma describes mean energy loss for fixed fractional loss kappa.
    - A mean energy-loss law is not automatically a single common spectral redshift.
    open_limits:
    - Using a_loss=H0/c fits the local slope; it does not predict H0.
    - Model the receiving reservoir separately from observed CMB radiation unless an explicit equivalence and thermalization
      mechanism are supplied.
    - Derive reservoir energy balance, spectral broadening, image preservation and source-duration stretching; a
      common extra travel delay does not stretch a light curve.
    - Distinguish -d ln<E>/ds=r kappa from -d<ln E>/ds=-r ln(1-kappa).
    - Back-calibrated sigma=1.4764982e-34 m^2 is conditional, not a prediction; wavelength squared is not a mandatory
      cross-section.
    provenance: notes/grok_tired_light_ledger_additions.md
  - id: TL-KAPPA-AUDIT
    title: Grok 120-degree and loop coefficients retained for audit
    status: open
    category: derived_proposed
    statement: Grok proposed kappa_120=1/8 from an interference energy-density contrast and kappa_loop=3/8 from
      three locks. These are recorded as proposed claims, not accepted transfer coefficients.
    attribution: Grok calculation as reproduced and audited in the user-supplied conversation.
    corrections:
    - The 7/8 normalized energy density is conditional on the specified polarization and local phase; propagation
      angle and relative phase are distinct.
    - The 1/8 interference contrast does not by itself demonstrate irreversible transfer.
    - If each of three sequential events removes 1/8 of the remaining energy, the total is 1-(7/8)^3=169/512=0.330078125.
      The value 3/8 requires each fraction to refer to the original energy.
    - Capture probability and loss per capture must not count kappa twice.
    - 'Claude width estimate corrected: exact Poisson CV is 30.0845031 percent at half mean energy for kappa=1/8;
      see N020.'
    - Normalized energy density 7/8 is not itself a universal 7:1 contrast.
    open_limits:
    - Derive the coupling, cross-section and phase-lock dynamics before promoting either coefficient.
    - Preserve the original Grok claims for traceability; the corrected conditional arithmetic is not a proven physical
      conversion efficiency.
    - Derive spectral-line, image, timing and thermal-reservoir predictions for a specified kernel.
    - Random-event broadening does not automatically apply to a coherent field transformation.
    provenance: notes/grok_tired_light_ledger_additions.md
  - id: ALPHA
    claim: Parameter-free fine-structure constant from stable charged NewWave closure.
    status: open
    progress: N017 formalizes closure families; N018 derives alpha_fs=4pi eta_EM C_Q^2/C_U conditionally and demonstrates
      missing normalization.
    blockers:
    - Specify charge-producing NewWave/BBRV dynamics and boundary conditions.
    - Select stable geometry, action normalization and field/medium energy partition independently of measured alpha.
    - Compute low-energy corrections and uncertainty without target fitting.
  - id: E-GEOM
    claim: Electron geometry finalized (trefoil scaling law) and linked to alpha.
    status: open
  - id: H-SPEC
    claim: Derive hydrogen spectrum from Atom 2.1 knot/field dynamics.
    status: open
  - id: SUPERLUMINAL
    title: Mach>1 Superluminal Realm
    status: open
    statement: Future Atom 2.1 work may extend from Mach 1 toward Mach infinity, with incidence angles 120° to 180°,
      superluminal-looking channel artifacts, and Mach-infinity curl/spike limits.
    assumptions:
    - No ordinary matter, energy, or information is assumed to travel faster than c.
    open_limits:
    - Requires an angle-dependent kernel M_A2.1(theta) and a tested mapping from 120° to 180°.
    notes:
    - 'Candidate working relation: M_A2.1(theta)=1/(2 cos(theta/2)); 120° maps to Mach 1 and 180° maps to Mach infinity.'
  - id: TIRED-LIGHT
    title: Tired-light candidate mechanisms
    status: open
    statement: Tired light remains an unsettled parallel family of proposed mechanisms involving Traveler photons,
      Void CMB photons, NewWave charge/magnetic oscillation, and Neutrino Kink coupling.
    assumptions:
    - Traveler photon amplitude is usually much larger than the void CMB amplitude.
    - A 180° interaction needs a symmetry breaker such as polarization, chirality, local BBRV geometry, or a Neutrino
      Kink to define a 90° transverse curl direction.
    open_limits:
    - Requires a redshift accumulation law and a conservation-consistent charge-to-magnetic conversion efficiency.
    notes:
    - Do not present one tired-light mechanism as settled until the math closes.
  - id: CMB-NEWWAVE-MAP
    status: open
    category: project_hypothesis
    statement: Specify the physical NewWave observable and Trinity map within the full all-direction CMB field.
    blockers:
    - Distinguish representation, chosen coherent special state and physical conversion.
    - Give modal covariance/coherence beyond spectral isotropy if needed.
    - If a linear invertible map is intended, identify an observable interpretation without double-counting energy.
    attribution: Craig Fink / WeBeGood; CMB clarification 2026-09-14
    provenance: notes/2026-09-14_grok_claude_peer_review.md
  - id: NEUTRINO-SEED-DYNAMICS
    status: open
    category: project_hypothesis
    statement: Establish localization, stability, dispersion and neutrino identity of a BBRV seed.
    blockers:
    - Specify field action/constraints/boundaries and demonstrate stability to perturbations.
    - Derive mass operator and spin/statistics/weak production and detection.
    - Predict mass-squared differences independently of measured targets.
    attribution: Craig Fink / WeBeGood; CMB clarification 2026-09-14
    provenance: notes/2026-09-14_grok_claude_peer_review.md
