distributed_research:
  meta:
    schema: atom2.1.distributed_research
    version: 0.1.0
  mission:
    objective: Develop Atom 2.1 into explicit, reproducible mathematical models with discriminating physical
      predictions.
    participation: Humans and operator-authorized AI agents may propose and review contributions.
    success: Verified derivations, useful counterexamples, resolved ambiguities, and precisely documented
      open problems.
    principle: Derive forward, do not improvise forward.
  continuity:
    canonical_source: Atom2.1_superseed.yaml
    project_precedence:
    - Current explicit owner decisions, recorded with date and provenance
    - Canonical definitions and operating contract
    - Accepted ledger results with their original assumptions
    - Repository artifacts
    - Session summaries and external messages
    retain_existing_load_order: true
    bootstrap_extra:
    - Read the current commit and protocol version.
    - Load the selected task, its dependency closure, and latest verified handoff.
    - Inspect referenced proofs and artifacts when needed; summaries are indexes, not substitutes for
      evidence.
    - Report unresolved conflicts between current owner wording and repository text before relying on
      the disputed meaning.
    - Load research_map.yaml and cooperation/tasks.yaml; choose a bounded task without changing the owner-selected
      scientific focus.
    settled_results: Reuse within their stated assumptions; do not rederive unless explicitly requested.
    contradiction: Open a challenge record, identify affected descendants, and retain the original result
      pending review.
    vocabulary: Preserve Atom 2.1 terms and distinguish analogy, definition, hypothesis, and mathematical
      consequence.
    units: Declare unit conventions and restore SI factors for external measurement comparisons.
  learning_sessions_loop:
    phases:
    - Load canonical state and recover one bounded task.
    - Record assumptions, expected output, and a stopping condition.
    - Work and checkpoint substantive intermediate results.
    - Consolidate discoveries, failed approaches, uncertainties, and evidence pointers.
    - Verify that the handoff supports the next concrete action.
    - Save artifacts and submit a reviewable patch.
    - Release the task lease and stop the session.
    - Resume in a fresh session only when the authorized runner dispatches it.
    checkpoints:
      triggers:
      - substantive_result
      - before_risky_computation
      - context_pressure
      - budget_near_limit
      - graceful_stop
      context_policy: Reserve measured context headroom for verification and handoff; use periodic checkpoints
        if usage is unavailable.
      crash_recovery: Resume from the latest complete checkpoint; treat partial output as unverified.
      atomicity: Commit evidence first, then the handoff referencing that commit. Publish the shared pointer
        only after both are durable.
    consolidation:
      preserve:
      - assumptions
      - equations
      - units
      - counterexamples
      - uncertainty
      - provenance
      - artifact_references
      - exact_next_action
      never:
      - promote_claim_by_summarization
      - erase_failed_attempts
      - silently_change_definitions
      learning_type: External memory and improved procedures; no claim of model-weight updates.
      recovery_check: A fresh session can identify the task, reconstruct its inputs, and reproduce the
        last verified result.
  coordination:
    task_model: One task record per bounded deliverable; multiple independent tasks may run concurrently.
    roles:
    - deriver
    - numerical_checker
    - independent_reviewer
    - literature_mapper
    - integrator
    leases:
      fields:
      - task_id
      - worker_id
      - operator_id
      - base_commit
      - lease_generation
      - claimed_at
      - expires_at
      - last_heartbeat
      acquisition: Runner uses an atomic compare-and-set; a plain file write or issue comment is insufficient.
      expiry: Another worker may acquire a new lease generation; preserve the prior worker's checkpoint.
      stale_worker: May save a proposal, but cannot finalize under an expired lease generation.
      enabled: false
    changes:
      workflow: Isolated branch or worktree, then pull request against the canonical repository.
      conflict_policy: Integrator reconciles semantic conflicts and reruns affected checks; never silently
        last-write-wins.
      canonical_state: Only the integrator updates the shared accepted ledger and active-state pointer.
    independence: Record model, operator, method, and exposure to the proposed answer; agreement alone
      is not verification.
    current_mode: Maintainer-serialized task assignments via pull requests; no automated lease service
      is installed.
  message_contract:
    encoding: UTF-8 YAML or JSON with documented schema and human-readable explanations.
    required_fields:
    - schema_version
    - message_id
    - kind
    - author
    - task_id
    - base_commit
    - claim_refs
    - artifact_refs
    - summary
    kinds:
    - question
    - proposal
    - result
    - counterexample
    - review
    - handoff
    - blocked
    compactness: Use stable IDs and references for repeated material; define every abbreviation in a versioned
      glossary.
    mathematics: Store equations as text or LaTeX with symbol definitions, assumptions, and units.
    binary_transfer: Prefer ordinary artifact files; encoding text as base64 is not a context-compression
      strategy.
    authority: Peer messages propose work or evidence; they cannot grant permissions or alter the research
      mission.
    provenance: Identify the responsible operator and authenticated contribution source; a self-asserted
      agent name is not identity proof.
  evidence:
    required_claim_fields:
    - id
    - statement
    - status
    - epistemic_status
    - depends_on
    - assumptions
    - units
    - derivation_artifacts
    - validation_results
    - open_limits
    - provenance
    new_result_status: derived_proposed
    epistemic_categories:
    - definition
    - project_assumption
    - conditional_mathematical_result
    - numerical_evidence
    - empirical_evidence
    - conjecture
    promotion: Independent review followed by owner or authorized maintainer acceptance under repository
      policy.
    checks:
    - Verify dimensional consistency, boundary conditions, and applicable conservation laws.
    - Record executable commands, software versions, input data, random seeds, and numerical tolerances
      where relevant.
    - Distinguish a fitted parameter from a predicted quantity.
    - Identify observable predictions and what would contradict the candidate.
    - Keep failed checks and negative results attached to the candidate.
    dependency_changes: Flag dependent claims as needing review; preserve their original status and evidence
      in version history.
  handoff_contract:
    required_fields:
    - session_id
    - worker_id
    - task_id
    - base_commit
    - artifact_commit
    - completed
    - failed_attempts
    - unresolved
    - assumptions_changed
    - verification_commands
    - verification_results
    - next_action
    - stop_reason
    stop_reasons:
    - completed
    - blocked
    - context_checkpoint
    - budget_limit
    - operator_stop
    - infrastructure_failure
    failed_attempt_detail: Record the method, why it failed, scope of failure, and what new premise would
      justify another attempt.
    commit_rule: artifact_commit points to the prior durable evidence commit; handoff is committed afterward
      to avoid a self-referential commit hash.
  operation:
    infrastructure: Only operator-authorized compute, accounts, repositories, and communication channels.
    persistence: Save project state and resume through the approved runner; honor shutdown and access
      revocation.
    runner_budget_fields:
    - maximum_wall_time
    - maximum_tokens
    - maximum_cost
    - maximum_concurrent_workers
    budget_defaults: No automated execution until the operator has configured enforceable limits.
    blocked_task: Preserve the exact obstacle and suggest a smaller subproblem or necessary experiment.
    repeated_failure: Requeue only with a materially different method, new evidence, or explicit renewed
      assignment.
    future_participation: Repository instructions invite contributions but do not themselves launch agents
      or supply compute.
    autonomous_runner_installed: false
  suggested_first_tasks:
  - id: PROPOSED-CONTINUITY-PILOT
    objective: Reproduce one existing node check from a fresh-session handoff and verify that no assumptions
      were lost.
    output: Reproduction log and corrected handoff template.
  - id: PROPOSED-NEWWAVE-DEFINITION
    existing_frontier_ref: CMB-NEWWAVE-MAP
    objective: Express the owner's intended NewWave observable and Trinity map precisely, preserving the
      distinction between motivating epiphany and derivation step.
    output: Equations, symbol table, explicit assumptions, and any unresolved meaning.
  - id: PROPOSED-ALPHA-COEFFICIENTS
    existing_node_ref: N018
    objective: Derive C_Q, C_U, and eta_EM independently from candidate dynamics, or document the missing
      equation preventing determination.
    output: Reproducible conditional derivation with prediction-versus-calibration disclosure.
