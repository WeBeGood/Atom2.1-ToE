  - path: Atom2.1_seed_latest.yaml
    role: seed_latest
  - path: derived_ledger.yaml
    role: derived_ledger
  - path: active_state_pointer.yaml
    role: active_state_pointer
  - path: frontier.yaml
    role: open_frontier
  - path: INIT.md
    role: human_llm_instructions
  - path: LLM_BOOTSTRAP_PROMPT.txt
    role: single_shot_prompt
  - path: distributed_research.yaml
    role: cooperative_contract
  - path: research_map.yaml
    role: research_branch_map
  load_order:
  - manifest.yaml
  - Atom2.1_seed_latest.yaml
  - derived_ledger.yaml
  - active_state_pointer.yaml
  - frontier.yaml
  - distributed_research.yaml
  - research_map.yaml
seed_latest:
  meta:
    name: Atom2.1 Seed (Latest)
    schema: atom2.1.seed
    version: 0.1.1
  axioms:
  - id: LUMINAL
    name: Mach-1 Luminal Realm
    statement: 'Most Atom 2.1 development is in the Luminal Realm: c=1, Mach 1, waves following waves through the
      Beltrami Blackbody Radiation Vortex photon/CMB sea.'
  - id: EMASS
    name: Natural-Unit Mass-Energy Equivalence
    statement: In the Mach-1 Luminal Realm, Einstein's E=mc^2 is handled in natural units as E=m; Restless Neutrino
      Mass and Rest Neutrino Mass are the same mass-energy in different topological states.
  - id: A120
    name: Luminal Trinity 120° Threshold
    statement: Within the Mach-1 Luminal Realm, the 120° Trinity Addition is treated as the first stable NewWave
      phase-lock threshold, not as the full future superluminal angle domain.
  - id: CMBMED
    name: CMB as Stabilizing Medium
    statement: CMB acts as universal medium supporting resonance / stabilization of wave knots in the Beltrami Blackbody
      Radiation Vortex.
  - id: REGIME_SPLIT
    name: Luminal versus Superluminal Regimes
    statement: Atom 2.1 separates the developed Mach-1 Luminal Realm from the proposed Mach>1 Superluminal Realm,
      where incidence angles run from 120° toward 180° and Mach-infinity is a geometric/interference limit.
  primitives:
  - photon_wave
  - antiwave
  - trinity_addition
  - phase_lock_120_luminal_threshold
  - luminal_realm_mach_1
  - superluminal_realm_mach_gt_1
  - mach_infinity_180_limit
  - knot_loop
  - seed_line
  - neutrino_kink
  - beltrami_vortex_mode
  canonical_notes:
  - Particles modeled as self-sustaining geometric wave patterns; rest mass from circular energy circulation.
  - Neutrino phenomena interpreted as boundary/turning-region behavior at loop edges.
  - Electron model under development; suspected geometric scaling relates to fine-structure constant.
  - 'Default ledger interpretation: unless a section explicitly says Superluminal Realm, treat the math as c=1,
    Mach-1 Luminal Realm math.'
  - 'Superluminal Realm development is proposed/open: it concerns interference geometry, phase closure, superluminal-looking
    channel artifacts, and Mach-infinity limits, not ordinary energy traveling faster than c.'
  - 'Owner clarification 2026-09-14: Trinity acts on the complete all-direction CMB/BBRV field; the two-isolated-beam
    baseline is not the complete proposal.'
  - Standing-wave, C3 and Beltrami representations are proved conditionally in N016. The proposed physical identification
    as a neutrino field remains distinct from the observed blackbody spectrum.
  - Accepted model conventions in the settled ledger are not automatically established experimental facts; use epistemic_status
    and explicit proof assumptions.
  - Mach 1 for constituent waves does not require the net flux of a standing field to travel at c. E=mc^2 denotes
    rest energy only in the rest frame; use total four-momentum for invariant mass.
