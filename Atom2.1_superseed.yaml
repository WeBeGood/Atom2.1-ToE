    assumptions:
    - Constant nonzero lambda and compatible gauge/boundary conditions.
    proof: nodes/N019_energy_helicity_modes/math/proofs.md
    proof_section: EH-01
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: EH-ELASTIC-MINIMUM
    title: Conditional uniform-twist elastic energy minimum
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: For fixed total twist, U=tau L+C Theta^2/(2L); positive fixed tau,C give L*=abs(Theta)sqrt(C/(2tau)).
    assumptions:
    - Postulated elastic functional; no derivation of its coefficients from Maxwell.
    - Fixed total twist, not fixed twist density; effective model valid at minimum.
    proof: nodes/N019_energy_helicity_modes/math/proofs.md
    proof_section: EH-03
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: EH-C3-SPECTRAL-FREEDOM
    title: C3 does not fix a mass spectrum
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: A Hermitian circulant has Fourier eigenvectors but eigenvalues a+2Re(b omega^j); unspecified coefficients
      prevent a mass prediction.
    assumptions:
    - Circulant Hermitian three-mode operator.
    proof: nodes/N019_energy_helicity_modes/math/proofs.md
    proof_section: EH-04
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  - id: TL-POISSON-MOMENTS
    title: Exact independent-event loss statistics
    status: proved_conditional
    epistemic_status: mathematical_result_under_explicit_assumptions
    statement: Poisson fixed-fraction losses give CV=sqrt(exp(mu kappa^2)-1), equal to 0.30084503098 at half mean
      energy and kappa=1/8.
    assumptions:
    - Independent Poisson event counts, fixed loss fraction, no energy-dependent rate.
    - Not a universal constraint on coherent/deterministic alternatives.
    proof: nodes/N020_tired_light_statistics/math/proofs.md
    proof_section: TL-02
    open_limits:
    - Does not establish the complete BBRV/neutrino identification.
  not_settled:
  - id: TL-TENSION-TWIST
    title: Longitudinal tension transfer into loop twist
    status: open
    category: conjecture
    statement: Traveling NewWave Charge-Only longitudinal tension may transfer energy into cold void loops or Neutrino
      Ether structures, lowering frequency while preserving propagation direction; receiving structures gain stored
      twist/restless mass.
    attribution: Craig Fink (WeBeGood), with Grok-assisted exploration; user terminology clarified in the supplied
      discussion.
    open_limits:
    - Specify the interaction and receiving degrees of freedom, including energy and forward momentum transfer.
    - Derive frequency conversion rather than amplitude attenuation; derive per-event angular and spectral preservation.
    - Loop phase locking and stability remain to be supplied or linked to existing derivations.
    provenance: notes/grok_tired_light_ledger_additions.md
  - id: TL-VOID-FILAMENT
    title: Environment-dependent redshift and propagation delay
    status: open
    category: conjecture
    statement: At comparable path lengths, cold void paths may produce greater longitudinal Charge-Only frequency
      loss but less delay than cosmic-web filament paths; filament matter/knots/twist may increase delay and Magnetic-Only
      lensing.
    attribution: Craig Fink (WeBeGood); September 5 void/filament conjecture and terminology correction.
    open_limits:
    - Derive dependence on local ether state and separate propagation-speed change from additional bent-path length.
    - The glass analogy supplies no constitutive law. Cosmic-web filament is intended, not a separate topological
      cosmic string.
    - Redshift is longitudinal in this conjecture; the unconfirmed transverse-redshift wording is superseded.
    provenance: notes/grok_tired_light_ledger_additions.md
  - id: DARK-TENSION-TWIST
    title: Dark energy as longitudinal tension; dark matter as magnetic twist
    status: open
    category: conjecture
    statement: Within Atom 2.1, dark energy is proposed to correspond to alternating charge attraction and longitudinal
      tension/compression along seed-lines, while dark matter corresponds to magnetic circulation, loops and stored
      twist.
    attribution: Craig Fink (WeBeGood), user-stated physical identification.
    equations:
    - p_vec = p n_hat; d(p_vec) = n_hat dp + p d(n_hat).
    open_limits:
    - The momentum decomposition is an identity; assigning magnitude change to tension and direction change to magnetic
      coupling is the conjecture.
    - Twist stores energy too; a tension-to-twist transfer does not automatically establish confined rest mass.
    - Derive the proposed interactions and compare their predictions with the phenomena attributed to dark energy
      and dark matter.
    provenance: notes/grok_tired_light_ledger_additions.md
  - id: TL-LOSS-LAW
    title: Conditional redshift accumulation and reservoir balance
    status: open
    category: derived_proposed
    statement: If d ln(nu)/ds = -a_loss(s), then 1+z = exp(integral a_loss(s) ds); the loss law is assumed, not
      derived from the interference calculation.
    attribution: Grok-assisted discussion; conditional integration retained with the audit limitations.
    units: 'a_loss: m^-1; s: m; nu: Hz; z: dimensionless. a_loss is not the fine-structure constant.'
    assumptions:
    - For independent targets of number density n_target and cross-section sigma, dP=n_target sigma ds; a_loss=kappa
      n_target sigma describes mean energy loss for fixed fractional loss kappa.
    - A mean energy-loss law is not automatically a single common spectral redshift.
    open_limits:
    - Using a_loss=H0/c fits the local slope; it does not predict H0.
    - Model the receiving reservoir separately from observed CMB radiation unless an explicit equivalence and thermalization
      mechanism are supplied.
    - Derive reservoir energy balance, spectral broadening, image preservation and source-duration stretching; a
      common extra travel delay does not stretch a light curve.
    - Distinguish -d ln<E>/ds=r kappa from -d<ln E>/ds=-r ln(1-kappa).
    - Back-calibrated sigma=1.4764982e-34 m^2 is conditional, not a prediction; wavelength squared is not a mandatory
      cross-section.
    provenance: notes/grok_tired_light_ledger_additions.md
  - id: TL-KAPPA-AUDIT
    title: Grok 120-degree and loop coefficients retained for audit
    status: open
    category: derived_proposed
    statement: Grok proposed kappa_120=1/8 from an interference energy-density contrast and kappa_loop=3/8 from
      three locks. These are recorded as proposed claims, not accepted transfer coefficients.
    attribution: Grok calculation as reproduced and audited in the user-supplied conversation.
    corrections:
    - The 7/8 normalized energy density is conditional on the specified polarization and local phase; propagation
      angle and relative phase are distinct.
    - The 1/8 interference contrast does not by itself demonstrate irreversible transfer.
    - If each of three sequential events removes 1/8 of the remaining energy, the total is 1-(7/8)^3=169/512=0.330078125.
      The value 3/8 requires each fraction to refer to the original energy.
    - Capture probability and loss per capture must not count kappa twice.
    - 'Claude width estimate corrected: exact Poisson CV is 30.0845031 percent at half mean energy for kappa=1/8;
      see N020.'
    - Normalized energy density 7/8 is not itself a universal 7:1 contrast.
    open_limits:
    - Derive the coupling, cross-section and phase-lock dynamics before promoting either coefficient.
    - Preserve the original Grok claims for traceability; the corrected conditional arithmetic is not a proven physical
      conversion efficiency.
    - Derive spectral-line, image, timing and thermal-reservoir predictions for a specified kernel.
    - Random-event broadening does not automatically apply to a coherent field transformation.
    provenance: notes/grok_tired_light_ledger_additions.md
  - id: ALPHA
    claim: Parameter-free fine-structure constant from stable charged NewWave closure.
    status: open
    progress: N017 formalizes closure families; N018 derives alpha_fs=4pi eta_EM C_Q^2/C_U conditionally and demonstrates
      missing normalization.
    blockers:
    - Specify charge-producing NewWave/BBRV dynamics and boundary conditions.
    - Select stable geometry, action normalization and field/medium energy partition independently of measured alpha.
    - Compute low-energy corrections and uncertainty without target fitting.
  - id: E-GEOM
    claim: Electron geometry finalized (trefoil scaling law) and linked to alpha.
    status: open
  - id: H-SPEC
    claim: Derive hydrogen spectrum from Atom 2.1 knot/field dynamics.
    status: open
  - id: SUPERLUMINAL
    title: Mach>1 Superluminal Realm
    status: open
    statement: Future Atom 2.1 work may extend from Mach 1 toward Mach infinity, with incidence angles 120° to 180°,
      superluminal-looking channel artifacts, and Mach-infinity curl/spike limits.
    assumptions:
    - No ordinary matter, energy, or information is assumed to travel faster than c.
    open_limits:
    - Requires an angle-dependent kernel M_A2.1(theta) and a tested mapping from 120° to 180°.
    notes:
    - 'Candidate working relation: M_A2.1(theta)=1/(2 cos(theta/2)); 120° maps to Mach 1 and 180° maps to Mach infinity.'
  - id: TIRED-LIGHT
    title: Tired-light candidate mechanisms
    status: open
    statement: Tired light remains an unsettled parallel family of proposed mechanisms involving Traveler photons,
      Void CMB photons, NewWave charge/magnetic oscillation, and Neutrino Kink coupling.
    assumptions:
    - Traveler photon amplitude is usually much larger than the void CMB amplitude.
    - A 180° interaction needs a symmetry breaker such as polarization, chirality, local BBRV geometry, or a Neutrino
      Kink to define a 90° transverse curl direction.
    open_limits:
    - Requires a redshift accumulation law and a conservation-consistent charge-to-magnetic conversion efficiency.
    notes:
    - Do not present one tired-light mechanism as settled until the math closes.
  - id: CMB-NEWWAVE-MAP
    status: open
    category: project_hypothesis
    statement: Specify the physical NewWave observable and Trinity map within the full all-direction CMB field.
    blockers:
    - Distinguish representation, chosen coherent special state and physical conversion.
    - Give modal covariance/coherence beyond spectral isotropy if needed.
    - If a linear invertible map is intended, identify an observable interpretation without double-counting energy.
    attribution: Craig Fink / WeBeGood; CMB clarification 2026-09-14
    provenance: notes/2026-09-14_grok_claude_peer_review.md
  - id: NEUTRINO-SEED-DYNAMICS
    status: open
    category: project_hypothesis
    statement: Establish localization, stability, dispersion and neutrino identity of a BBRV seed.
    blockers:
    - Specify field action/constraints/boundaries and demonstrate stability to perturbations.
    - Derive mass operator and spin/statistics/weak production and detection.
    - Predict mass-squared differences independently of measured targets.
    attribution: Craig Fink / WeBeGood; CMB clarification 2026-09-14
    provenance: notes/2026-09-14_grok_claude_peer_review.md
