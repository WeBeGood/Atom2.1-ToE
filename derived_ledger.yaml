meta:
  name: Atom2.1 Derived Ledger
  schema: atom2.1.ledger
  version: 0.1.1
settled:
- id: LUMINAL
  title: Mach-1 Luminal Realm convention
  status: accepted
  statement: Atom 2.1's developed core defaults to c=1, Mach 1, waves following waves in the BBRV photon/CMB
    sea.
  assumptions:
  - Natural units are used inside the Luminal Realm.
  - SI factors of c must be restored before comparing to external measurements.
  open_limits:
  - Does not itself prove particle closure, gravity, or tired-light mechanisms.
  notes:
  - This resolves the prior Mach-1 dimensional-mixing confusion by declaring the working unit convention.
- id: EMASS
  title: Restless/Rest Neutrino Mass equivalence in c=1 units
  status: accepted
  statement: 'With c=1, E=mc^2 reduces to E=m; Restless Neutrino Mass and Rest Neutrino Mass are treated
    as the same mass-energy in different topological states: open wave motion versus stored curl/kink/loop/knot
    structure.'
  assumptions:
  - This is an Atom 2.1 natural-unit statement, not a claim that ordinary photons have rest mass in standard
    relativity.
  open_limits:
  - Requires careful SI restoration in cosmology, G, and Lambda derivations.
  notes:
  - Use this as the default mass-energy language for BBRV/Luminal Realm work.
- id: A120
  title: Luminal Trinity 120° threshold
  status: accepted
  statement: The 120° Trinity Addition is retained as the Mach-1 Luminal Realm threshold for two Mach-1
    wave structures defining a third Mach-1 NewWave mode.
  assumptions:
  - Trinity Addition is an Atom 2.1 NewWave rule and must be distinguished from ordinary four-momentum
    addition.
  open_limits:
  - The 120° case is not the entire Superluminal Realm and is not by itself a tired-light derivation.
  notes:
  - Older wording that made 120° the only interaction angle should be read as Luminal-Realm shorthand.
- id: CMBMED
  title: CMB/BBRV stabilizing medium
  status: accepted
  statement: The CMB is treated as the observable photon-sea/BBRV medium supporting resonance, seed-line
    behavior, and wave-knot stabilization.
  assumptions:
  - CMB medium language belongs to Atom 2.1 model-building unless cross-walked to standard cosmology.
  open_limits:
  - Does not fix the absolute vacuum-energy scale by itself.
  notes:
  - Use BBRV photon/CMB sea as the default Luminal Realm background.
- id: REGIME_SPLIT
  title: Luminal and Superluminal regime separation
  status: accepted
  statement: Atom 2.1 is now explicitly divided into the developed Mach-1 Luminal Realm and the proposed
    Mach>1 Superluminal Realm. Most prior ledger work belongs to the Luminal Realm.
  assumptions:
  - Mach>1 language describes geometric/interference/phase-channel artifacts unless explicitly proven
    otherwise.
  open_limits:
  - Superluminal Realm mathematics remains frontier work.
  notes:
  - This entry is the main ledger correction requested on 2026-09-07.
not_settled:
- id: TL-TENSION-TWIST
  title: Longitudinal tension transfer into loop twist
  status: open
  category: conjecture
  statement: Traveling NewWave Charge-Only longitudinal tension may transfer energy into cold void loops
    or Neutrino Ether structures, lowering frequency while preserving propagation direction; receiving
    structures gain stored twist/restless mass.
  attribution: Craig Fink (WeBeGood), with Grok-assisted exploration; user terminology clarified in the
    supplied discussion.
  open_limits:
  - Specify the interaction and receiving degrees of freedom, including energy and forward momentum transfer.
  - Derive frequency conversion rather than amplitude attenuation; derive per-event angular and spectral
    preservation.
  - Loop phase locking and stability remain to be supplied or linked to existing derivations.
  provenance: notes/grok_tired_light_ledger_additions.md
- id: TL-VOID-FILAMENT
  title: Environment-dependent redshift and propagation delay
  status: open
  category: conjecture
  statement: At comparable path lengths, cold void paths may produce greater longitudinal Charge-Only
    frequency loss but less delay than cosmic-web filament paths; filament matter/knots/twist may increase
    delay and Magnetic-Only lensing.
  attribution: Craig Fink (WeBeGood); September 5 void/filament conjecture and terminology correction.
  open_limits:
  - Derive dependence on local ether state and separate propagation-speed change from additional bent-path
    length.
  - The glass analogy supplies no constitutive law. Cosmic-web filament is intended, not a separate topological
    cosmic string.
  - Redshift is longitudinal in this conjecture; the unconfirmed transverse-redshift wording is superseded.
  provenance: notes/grok_tired_light_ledger_additions.md
- id: DARK-TENSION-TWIST
  title: Dark energy as longitudinal tension; dark matter as magnetic twist
  status: open
  category: conjecture
  statement: Within Atom 2.1, dark energy is proposed to correspond to alternating charge attraction and
    longitudinal tension/compression along seed-lines, while dark matter corresponds to magnetic circulation,
    loops and stored twist.
  attribution: Craig Fink (WeBeGood), user-stated physical identification.
  equations:
  - p_vec = p n_hat; d(p_vec) = n_hat dp + p d(n_hat).
  open_limits:
  - The momentum decomposition is an identity; assigning magnitude change to tension and direction change
    to magnetic coupling is the conjecture.
  - Twist stores energy too; a tension-to-twist transfer does not automatically establish confined rest
    mass.
  - Derive the proposed interactions and compare their predictions with the phenomena attributed to dark
    energy and dark matter.
  provenance: notes/grok_tired_light_ledger_additions.md
- id: TL-LOSS-LAW
  title: Conditional redshift accumulation and reservoir balance
  status: open
  category: derived_proposed
  statement: If d ln(nu)/ds = -a_loss(s), then 1+z = exp(integral a_loss(s) ds); the loss law is assumed,
    not derived from the interference calculation.
  attribution: Grok-assisted discussion; conditional integration retained with the audit limitations.
  units: 'a_loss: m^-1; s: m; nu: Hz; z: dimensionless. a_loss is not the fine-structure constant.'
  assumptions:
  - For independent targets of number density n_target and cross-section sigma, dP=n_target sigma ds;
    a_loss=kappa n_target sigma describes mean energy loss for fixed fractional loss kappa.
  - A mean energy-loss law is not automatically a single common spectral redshift.
  open_limits:
  - Using a_loss=H0/c fits the local slope; it does not predict H0.
  - Model the receiving reservoir separately from observed CMB radiation unless an explicit equivalence
    and thermalization mechanism are supplied.
  - Derive reservoir energy balance, spectral broadening, image preservation and source-duration stretching;
    a common extra travel delay does not stretch a light curve.
  provenance: notes/grok_tired_light_ledger_additions.md
- id: TL-KAPPA-AUDIT
  title: Grok 120-degree and loop coefficients retained for audit
  status: open
  category: derived_proposed
  statement: Grok proposed kappa_120=1/8 from an interference energy-density contrast and kappa_loop=3/8
    from three locks. These are recorded as proposed claims, not accepted transfer coefficients.
  attribution: Grok calculation as reproduced and audited in the user-supplied conversation.
  corrections:
  - The 7/8 normalized energy density is conditional on the specified polarization and local phase; propagation
    angle and relative phase are distinct.
  - The 1/8 interference contrast does not by itself demonstrate irreversible transfer.
  - If each of three sequential events removes 1/8 of the remaining energy, the total is 1-(7/8)^3=169/512=0.330078125.
    The value 3/8 requires each fraction to refer to the original energy.
  - Capture probability and loss per capture must not count kappa twice.
  open_limits:
  - Derive the coupling, cross-section and phase-lock dynamics before promoting either coefficient.
  - Preserve the original Grok claims for traceability; the corrected conditional arithmetic is not a
    proven physical conversion efficiency.
  provenance: notes/grok_tired_light_ledger_additions.md
- id: ALPHA
  claim: Parameter-free fine-structure constant from stable charged NewWave closure.
  status: open
  progress: N017 formalizes closure families; N018 derives alpha_fs=4pi eta_EM C_Q^2/C_U conditionally
    and demonstrates missing normalization.
  blockers:
  - Specify charge-producing NewWave/BBRV dynamics and boundary conditions.
  - Select stable geometry, action normalization and field/medium energy partition independently of measured
    alpha.
  - Compute low-energy corrections and uncertainty without target fitting.
- id: E-GEOM
  claim: Electron geometry finalized (trefoil scaling law) and linked to alpha.
  status: open
- id: H-SPEC
  claim: Derive hydrogen spectrum from Atom 2.1 knot/field dynamics.
  status: open
- id: SUPERLUMINAL
  title: Mach>1 Superluminal Realm
  status: open
  statement: Future Atom 2.1 work may extend from Mach 1 toward Mach infinity, with incidence angles 120°
    to 180°, superluminal-looking channel artifacts, and Mach-infinity curl/spike limits.
  assumptions:
  - No ordinary matter, energy, or information is assumed to travel faster than c.
  open_limits:
  - Requires an angle-dependent kernel M_A2.1(theta) and a tested mapping from 120° to 180°.
  notes:
  - 'Candidate working relation: M_A2.1(theta)=1/(2 cos(theta/2)); 120° maps to Mach 1 and 180° maps to
    Mach infinity.'
- id: TIRED-LIGHT
  title: Tired-light candidate mechanisms
  status: open
  statement: Tired light remains an unsettled parallel family of proposed mechanisms involving Traveler
    photons, Void CMB photons, NewWave charge/magnetic oscillation, and Neutrino Kink coupling.
  assumptions:
  - Traveler photon amplitude is usually much larger than the void CMB amplitude.
  - A 180° interaction needs a symmetry breaker such as polarization, chirality, local BBRV geometry,
    or a Neutrino Kink to define a 90° transverse curl direction.
  open_limits:
  - Requires a redshift accumulation law and a conservation-consistent charge-to-magnetic conversion efficiency.
  notes:
  - Do not present one tired-light mechanism as settled until the math closes.
