- id: SUPERLUMINAL
  title: Mach>1 Superluminal Realm
  status: open
  statement: Future Atom 2.1 work may extend from Mach 1 toward Mach infinity, with incidence angles 120° to 180°, superluminal-looking channel artifacts, and Mach-infinity curl/spike limits.
  assumptions:
  - No ordinary matter, energy, or information is assumed to travel faster than c.
  open_limits:
  - Requires an angle-dependent kernel M_A2.1(theta) and a tested mapping from 120° to 180°.
  notes:
  - 'Candidate working relation: M_A2.1(theta)=1/(2 cos(theta/2)); 120° maps to Mach 1 and 180° maps to Mach infinity.'
- id: TIRED-LIGHT
  title: Tired-light candidate mechanisms
  status: open
  statement: Tired light remains an unsettled parallel family of proposed mechanisms involving Traveler photons, Void CMB photons, NewWave charge/magnetic oscillation, and Neutrino Kink coupling.
  assumptions:
  - Traveler photon amplitude is usually much larger than the void CMB amplitude.
  - A 180° interaction needs a symmetry breaker such as polarization, chirality, local BBRV geometry, or a Neutrino Kink to define a 90° transverse curl direction.
  open_limits:
  - Requires a redshift accumulation law and a conservation-consistent charge-to-magnetic conversion efficiency.
  notes:
  - Do not present one tired-light mechanism as settled until the math closes.
